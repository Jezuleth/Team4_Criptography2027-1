name: Python Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: pytest · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -q

      - name: Run final demo (console)
        run: python demo_final.py

  pytest-required:
    name: Run pytest
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Verify all test combinations
        shell: bash
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "At least one test combination failed."
            exit 1
          fi
          echo "All six test combinations passed."